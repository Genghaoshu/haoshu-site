<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haoshu | 个人主页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: #18212f;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #dff8e9, transparent 35%),
        radial-gradient(circle at 85% 80%, #dceaff, transparent 38%),
        #f6f8fb;
    }

    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    .card {
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 80px rgba(21, 51, 42, 0.12);
      backdrop-filter: blur(18px);
    }

    .topline,
    .section-heading,
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      color: #176b42;
      background: #dff7e7;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 24px 0 16px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    h1 span,
    h2 {
      color: #158a57;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 26px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    p {
      color: #596374;
      font-size: 17px;
      line-height: 1.75;
    }

    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #18212f;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .button:hover {
      background: #158a57;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .text-button {
      min-height: auto;
      padding: 6px 10px;
      color: #158a57;
      background: transparent;
      font-size: 14px;
    }

    .text-button:hover {
      background: #dff7e7;
    }

    .post-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .post {
      padding: 20px;
      border: 1px solid #e3e9ef;
      border-radius: 16px;
      background: white;
    }

    .post-content {
      margin: 0;
      color: #465263;
      white-space: pre-wrap;
    }

    .post-time,
    .muted {
      color: #748092;
      font-size: 13px;
    }

    .post-time {
      margin-top: 14px;
    }

    .admin-panel {
      border: 1px solid #ccebdd;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd5df;
      border-radius: 10px;
      background: white;
      color: #18212f;
      font: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .message {
      min-height: 24px;
      color: #a44217;
    }

    .success {
      color: #176b42;
    }

    footer {
      padding: 8px 0 32px;
      color: #748092;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="card">
      <div class="topline">
        <div class="badge">PERSONAL WEBSITE</div>
        <button id="adminToggle" class="text-button" type="button">管理</button>
      </div>

      <h1>你好，我是 <span>Haoshu</span></h1>

      <p>
        这里是我的个人网站。我会用它记录学习过程、分享项目，
        并逐步加入可以实时更新的内容。
      </p>

      <a class="button" href="https://github.com/Genghaoshu">我的 GitHub</a>
    </section>

    <section id="adminPanel" class="card admin-panel" hidden>
      <div class="section-heading">
        <h2>管理员发布</h2>
        <button id="closeAdmin" class="text-button" type="button">关闭</button>
      </div>

      <form id="loginForm">
        <label>
          邮箱
          <input id="email" type="email" autocomplete="username" required>
        </label>

        <label>
          密码
          <input id="password" type="password" autocomplete="current-password" required>
        </label>

        <button id="loginButton" type="submit">登录</button>
        <div id="loginMessage" class="message"></div>
      </form>

      <div id="adminContent" hidden>
        <form id="publishForm">
          <label>
            标题
            <input id="postTitle" type="text" maxlength="100" required>
          </label>

          <label>
            内容
            <textarea id="postContent" maxlength="5000" required></textarea>
          </label>

          <div class="action-row">
            <button id="publishButton" type="submit">立即发布</button>
            <button id="logoutButton" class="text-button" type="button">退出登录</button>
          </div>

          <div id="publishMessage" class="message"></div>
        </form>
      </div>
    </section>

    <section class="card">
      <h2>最近动态</h2>
      <div id="feedStatus" class="muted">正在加载……</div>
      <div id="postList" class="post-list"></div>
    </section>

    <footer>© 2026 Haoshu</footer>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://rowofdeyfmwjhyhyfvfnk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5BTJRWDjAio09BMs2qozAA_ATDCXSf9";
    const ADMIN_ID = "f81f8d77-c213-4732-9777-cfa0e7fe8204";

    const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const adminToggle = document.querySelector("#adminToggle");
    const adminPanel = document.querySelector("#adminPanel");
    const closeAdmin = document.querySelector("#closeAdmin");
    const loginForm = document.querySelector("#loginForm");
    const loginMessage = document.querySelector("#loginMessage");
    const loginButton = document.querySelector("#loginButton");
    const adminContent = document.querySelector("#adminContent");
    const publishForm = document.querySelector("#publishForm");
    const publishButton = document.querySelector("#publishButton");
    const publishMessage = document.querySelector("#publishMessage");
    const postTitle = document.querySelector("#postTitle");
    const postContent = document.querySelector("#postContent");
    const logoutButton = document.querySelector("#logoutButton");
    const feedStatus = document.querySelector("#feedStatus");
    const postList = document.querySelector("#postList");

    function formatTime(value) {
      return new Intl.DateTimeFormat("zh-CN", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function renderPosts(posts) {
      postList.replaceChildren();

      if (!posts.length) {
        feedStatus.hidden = false;
        feedStatus.textContent = "还没有动态。";
        return;
      }

      feedStatus.hidden = true;

      for (const post of posts) {
        const article = document.createElement("article");
        article.className = "post";

        const title = document.createElement("h3");
        title.textContent = post.title;

        const content = document.createElement("p");
        content.className = "post-content";
        content.textContent = post.content;

        const time = document.createElement("div");
        time.className = "post-time";
        time.textContent = formatTime(post.created_at);

        article.append(title, content, time);
        postList.append(article);
      }
    }

    async function loadPosts() {
      const { data, error } = await db
        .from("site_posts")
        .select("id, title, content, created_at")
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) {
        feedStatus.hidden = false;
        feedStatus.textContent = "动态加载失败，请刷新页面。";
        console.error(error);
        return;
      }

      renderPosts(data);
    }

    async function syncAdminState() {
      const { data } = await db.auth.getSession();
      const user = data.session?.user;

      if (!user) {
        loginForm.hidden = false;
        adminContent.hidden = true;
        return;
      }

      loginForm.hidden = true;

      if (user.id === ADMIN_ID) {
        adminContent.hidden = false;
        loginMessage.textContent = "";
      } else {
        adminContent.hidden = true;
        loginMessage.textContent = "这个账号没有发布权限。";
      }
    }

    adminToggle.addEventListener("click", () => {
      adminPanel.hidden = false;
      adminPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    closeAdmin.addEventListener("click", () => {
      adminPanel.hidden = true;
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      loginMessage.textContent = "正在登录……";

      const { error } = await db.auth.signInWithPassword({
        email: document.querySelector("#email").value.trim(),
        password: document.querySelector("#password").value
      });

      loginButton.disabled = false;

      if (error) {
        loginMessage.textContent = "登录失败：" + error.message;
        return;
      }

      loginMessage.textContent = "";
      await syncAdminState();
    });

    publishForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      publishButton.disabled = true;
      publishMessage.textContent = "正在发布……";

      const { error } = await db.from("site_posts").insert({
        title: postTitle.value.trim(),
        content: postContent.value.trim()
      });

      publishButton.disabled = false;

      if (error) {
        publishMessage.textContent = "发布失败：" + error.message;
        console.error(error);
        return;
      }

      publishForm.reset();
      publishMessage.className = "message success";
      publishMessage.textContent = "发布成功，首页已实时更新。";
      await loadPosts();
    });

    logoutButton.addEventListener("click", async () => {
      await db.auth.signOut();
      publishMessage.textContent = "";
      await syncAdminState();
    });

    db.channel("site-posts-feed")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "site_posts" },
        () => loadPosts()
      )
      .subscribe();

    await syncAdminState();
    await loadPosts();
  </script>
</body>
</html>
