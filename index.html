<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haoshu | 个人主页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #18212f;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #dff8e9, transparent 35%),
        radial-gradient(circle at 85% 80%, #dceaff, transparent 38%),
        #f6f8fb;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 24px 80px rgba(21, 51, 42, 0.12);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      color: #176b42;
      background: #dff7e7;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 24px 0 16px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    h1 span {
      color: #158a57;
    }

    p {
      max-width: 560px;
      margin: 14px 0;
      color: #596374;
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.8;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    a {
      padding: 12px 18px;
      border-radius: 12px;
      color: white;
      background: #18212f;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #158a57;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">PERSONAL WEBSITE</div>

    <h1>你好，我是 <span>Haoshu</span></h1>

    <p>
      这里是我的个人网站。我会用它记录学习过程、分享项目，
      并逐步加入可以实时更新的内容。
    </p>

    <div class="links">
      <a href="https://github.com/Genggaoshu">我的 GitHub</a>
    </div>
  </main>
</body>
</html>
